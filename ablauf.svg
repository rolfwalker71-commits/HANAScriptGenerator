<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="2776" viewBox="0 0 1180 2776" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1180" height="2776" fill="#eef2f4"/>
<text x="40" y="52" font-size="30" font-weight="700" fill="#1b2b33">SAP HANA Schema-Export — Ausrollen beim Kunden</text>
<text x="40" y="80" font-size="16" fill="#5d6b73">Reihenfolge der Schritte vom Wizard bis zum laufenden Cronjob, mit allen Aufrufparametern</text>
<text x="40" y="102" font-size="13" fill="#5d6b73">Erzeugt durch HANAScriptGenerator</text>
<rect x="40" y="116" width="1100" height="604" rx="14" fill="#ffffff" stroke="#d5dde1"/>
<path d="M 40 130 a 14 14 0 0 1 14 -14 h 1072 a 14 14 0 0 1 14 14 v 52 h -1100 z" fill="#006887"/>
<circle cx="74" cy="149.0" r="17" fill="#ffffff" opacity="0.9"/>
<text x="74" y="156.0" font-size="19" font-weight="700" fill="#006887" text-anchor="middle">1</text>
<text x="106" y="146" font-size="20" font-weight="700" fill="#ffffff">Auf dem Windows-Rechner</text>
<text x="106" y="166" font-size="13.5" fill="#ffffff" opacity="0.85">Kein npm, keine Installation</text>
<rect x="54" y="194" width="1072" height="96" rx="9" fill="#f2f5f7"/>
<rect x="54" y="194" width="4" height="96" fill="#006887"/>
<circle cx="86" cy="220" r="13" fill="#006887"/>
<text x="86" y="225" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="110" y="218" font-size="16.5" font-weight="600" fill="#1b2b33">Wizard ausfüllen</text>
<text x="110" y="244" font-size="15" fill="#006887" font-family="DejaVu Sans Mono, Consolas, monospace">HANAScriptGenerator.html doppelklicken</text>
<text x="110" y="268" font-size="13" fill="#5d6b73">Sieben Schritte. Pfade und Benutzer werden aus SID und Instanznummer vorgeschlagen.</text>
<rect x="54" y="300" width="1072" height="146" rx="9" fill="#f2f5f7"/>
<rect x="54" y="300" width="4" height="146" fill="#006887"/>
<circle cx="86" cy="326" r="13" fill="#006887"/>
<text x="86" y="331" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="110" y="324" font-size="16.5" font-weight="600" fill="#1b2b33">Schemas holen  ·  optional</text>
<text x="110" y="350" font-size="15" fill="#006887" font-family="DejaVu Sans Mono, Consolas, monospace">00_schemas_auslesen.cmd</text>
<text x="126" y="372" font-size="13.5" fill="#006887" font-family="DejaVu Sans Mono, Consolas, monospace">set USERSTORE_KEY=…</text>
<text x="293" y="372" font-size="13.5" fill="#1b2b33">über einen hdbuserstore-Key statt Passwortabfrage</text>
<text x="126" y="393" font-size="13.5" fill="#006887" font-family="DejaVu Sans Mono, Consolas, monospace">set HANA_DB=…</text>
<text x="293" y="393" font-size="13.5" fill="#1b2b33">einen anderen Tenant abfragen  (hdbsql -d)</text>
<text x="110" y="424" font-size="13" fill="#5d6b73">Schreibt schemas.txt neben die Datei. Alternativ Befehl kopieren und Ausgabe einfügen.</text>
<rect x="54" y="456" width="1072" height="96" rx="9" fill="#f2f5f7"/>
<rect x="54" y="456" width="4" height="96" fill="#006887"/>
<circle cx="86" cy="482" r="13" fill="#006887"/>
<text x="86" y="487" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="110" y="480" font-size="16.5" font-weight="600" fill="#1b2b33">Skripte erzeugen</text>
<text x="110" y="506" font-size="15" fill="#006887" font-family="DejaVu Sans Mono, Consolas, monospace">Alle als ZIP  →  vollständig entpacken</text>
<text x="110" y="530" font-size="13" fill="#5d6b73">Dabei sind export.conf und export_schemas.txt. Alles gehört in einen Ordner.</text>
<rect x="54" y="562" width="1072" height="146" rx="9" fill="#f2f5f7"/>
<rect x="54" y="562" width="4" height="146" fill="#006887"/>
<circle cx="86" cy="588" r="13" fill="#006887"/>
<text x="86" y="593" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="110" y="586" font-size="16.5" font-weight="600" fill="#1b2b33">Auf den Server übertragen</text>
<text x="110" y="612" font-size="15" fill="#006887" font-family="DejaVu Sans Mono, Consolas, monospace">00_dateien_uebertragen.cmd</text>
<text x="126" y="634" font-size="13.5" fill="#006887" font-family="DejaVu Sans Mono, Consolas, monospace">--key</text>
<text x="180" y="634" font-size="13.5" fill="#1b2b33">einmalig SSH-Schlüssel einrichten, danach ohne Passwort</text>
<text x="126" y="655" font-size="13.5" fill="#006887" font-family="DejaVu Sans Mono, Consolas, monospace">--scp</text>
<text x="180" y="655" font-size="13.5" fill="#1b2b33">Einzelschritte statt einem Durchgang, falls tar fehlt</text>
<text x="110" y="686" font-size="13" fill="#5d6b73">Setzt Zeilenenden, chmod 750, Gruppe sapsys. Dort gepflegte export.conf und export_schemas.txt bleiben stehen.</text>
<rect x="40" y="744" width="1100" height="1099" rx="14" fill="#ffffff" stroke="#d5dde1"/>
<path d="M 40 758 a 14 14 0 0 1 14 -14 h 1072 a 14 14 0 0 1 14 14 v 52 h -1100 z" fill="#f5a61a"/>
<circle cx="74" cy="777.0" r="17" fill="#ffffff" opacity="0.9"/>
<text x="74" y="784.0" font-size="19" font-weight="700" fill="#f5a61a" text-anchor="middle">2</text>
<text x="106" y="774" font-size="20" font-weight="700" fill="#ffffff">Auf dem HANA-Server</text>
<text x="106" y="794" font-size="13.5" fill="#ffffff" opacity="0.85">Alles als &lt;sid&gt;adm — der hdbuserstore ist benutzerspezifisch</text>
<rect x="54" y="822" width="1072" height="96" rx="9" fill="#f2f5f7"/>
<rect x="54" y="822" width="4" height="96" fill="#f5a61a"/>
<circle cx="86" cy="848" r="13" fill="#f5a61a"/>
<text x="86" y="853" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="110" y="846" font-size="16.5" font-weight="600" fill="#1b2b33">Anmelden</text>
<text x="110" y="872" font-size="15" fill="#f5a61a" font-family="DejaVu Sans Mono, Consolas, monospace">su - &lt;sid&gt;adm   →   cd &lt;SKRIPTPFAD&gt;</text>
<text x="110" y="896" font-size="13" fill="#5d6b73">Kontrolle:  whoami  &amp;&amp;  ls -l *.sh</text>
<rect x="54" y="928" width="1072" height="96" rx="9" fill="#f2f5f7"/>
<rect x="54" y="928" width="4" height="96" fill="#f5a61a"/>
<circle cx="86" cy="954" r="13" fill="#f5a61a"/>
<text x="86" y="959" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<text x="110" y="952" font-size="16.5" font-weight="600" fill="#1b2b33">Userstore-Key anlegen</text>
<text x="110" y="978" font-size="15" fill="#f5a61a" font-family="DejaVu Sans Mono, Consolas, monospace">./01_setup_userstore.sh</text>
<text x="110" y="1002" font-size="13" fill="#5d6b73">Ohne Parameter. Passwort wird verdeckt abgefragt und landet nie in einer Datei.</text>
<rect x="54" y="1034" width="1072" height="96" rx="9" fill="#f2f5f7"/>
<rect x="54" y="1034" width="4" height="96" fill="#f5a61a"/>
<circle cx="86" cy="1060" r="13" fill="#f5a61a"/>
<text x="86" y="1065" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
<text x="110" y="1058" font-size="16.5" font-weight="600" fill="#1b2b33">Verzeichnisse anlegen</text>
<text x="110" y="1084" font-size="15" fill="#f5a61a" font-family="DejaVu Sans Mono, Consolas, monospace">./02_prepare_dirs.sh</text>
<text x="110" y="1108" font-size="13" fill="#5d6b73">Ohne Parameter. Prüft jedes Verzeichnis einzeln auf Schreibrecht.</text>
<rect x="54" y="1140" width="1072" height="96" rx="9" fill="#f2f5f7"/>
<rect x="54" y="1140" width="4" height="96" fill="#f5a61a"/>
<circle cx="86" cy="1166" r="13" fill="#f5a61a"/>
<text x="86" y="1171" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">8</text>
<text x="110" y="1164" font-size="16.5" font-weight="600" fill="#1b2b33">Vorabprüfung</text>
<text x="110" y="1190" font-size="15" fill="#f5a61a" font-family="DejaVu Sans Mono, Consolas, monospace">./03_preflight.sh</text>
<text x="110" y="1214" font-size="13" fill="#5d6b73">Ohne Parameter. ERST WEITER, WENN FEHLERFREI. Ändert nichts, beliebig wiederholbar.</text>
<rect x="54" y="1246" width="1072" height="146" rx="9" fill="#f2f5f7"/>
<rect x="54" y="1246" width="4" height="146" fill="#f5a61a"/>
<circle cx="86" cy="1272" r="13" fill="#f5a61a"/>
<text x="86" y="1277" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">9</text>
<text x="110" y="1270" font-size="16.5" font-weight="600" fill="#1b2b33">Testexport</text>
<text x="110" y="1296" font-size="15" fill="#f5a61a" font-family="DejaVu Sans Mono, Consolas, monospace">./04_test_export.sh</text>
<text x="126" y="1318" font-size="13.5" fill="#f5a61a" font-family="DejaVu Sans Mono, Consolas, monospace">[SCHEMA]</text>
<text x="204" y="1318" font-size="13.5" fill="#1b2b33">dieses Schema statt des ersten aus export_schemas.txt</text>
<text x="126" y="1339" font-size="13.5" fill="#f5a61a" font-family="DejaVu Sans Mono, Consolas, monospace">--keep</text>
<text x="204" y="1339" font-size="13.5" fill="#1b2b33">Testdaten liegen lassen statt sie zu entfernen</text>
<text x="110" y="1370" font-size="13" fill="#5d6b73">Beweist Export und tar-Lauf, bevor Cron übernimmt. Zeigt auch die Laufzeit.</text>
<rect x="54" y="1402" width="1072" height="146" rx="9" fill="#f2f5f7"/>
<rect x="54" y="1402" width="4" height="146" fill="#f5a61a"/>
<circle cx="86" cy="1428" r="13" fill="#f5a61a"/>
<text x="86" y="1433" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">10</text>
<text x="110" y="1426" font-size="16.5" font-weight="600" fill="#1b2b33">StorageBox einrichten  ·  falls Auslagerung</text>
<text x="110" y="1452" font-size="15" fill="#f5a61a" font-family="DejaVu Sans Mono, Consolas, monospace">./06_offload_storagebox.sh</text>
<text x="126" y="1474" font-size="13.5" fill="#f5a61a" font-family="DejaVu Sans Mono, Consolas, monospace">--setup</text>
<text x="196" y="1474" font-size="13.5" fill="#1b2b33">Schlüssel anlegen, auf der Box ablegen, Anmeldung prüfen</text>
<text x="126" y="1495" font-size="13.5" fill="#f5a61a" font-family="DejaVu Sans Mono, Consolas, monospace">--check</text>
<text x="196" y="1495" font-size="13.5" fill="#1b2b33">nur die Anmeldung prüfen, nichts übertragen</text>
<text x="110" y="1526" font-size="13" fill="#5d6b73">Wiederholen schadet nicht. --setup-key und --install-key sind ältere Namen für --setup.</text>
<rect x="54" y="1558" width="1072" height="96" rx="9" fill="#f2f5f7"/>
<rect x="54" y="1558" width="4" height="96" fill="#f5a61a"/>
<circle cx="86" cy="1584" r="13" fill="#f5a61a"/>
<text x="86" y="1589" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">11</text>
<text x="110" y="1582" font-size="16.5" font-weight="600" fill="#1b2b33">Erster echter Lauf</text>
<text x="110" y="1608" font-size="15" fill="#f5a61a" font-family="DejaVu Sans Mono, Consolas, monospace">&lt;SKRIPTPFAD&gt;/schema_export.sh   →   echo $?</text>
<text x="110" y="1632" font-size="13" fill="#5d6b73">Ohne Parameter, alles Weitere steht in export.conf. Muss 0 ergeben.</text>
<rect x="54" y="1664" width="1072" height="167" rx="9" fill="#f2f5f7"/>
<rect x="54" y="1664" width="4" height="167" fill="#f5a61a"/>
<circle cx="86" cy="1690" r="13" fill="#f5a61a"/>
<text x="86" y="1695" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">12</text>
<text x="110" y="1688" font-size="16.5" font-weight="600" fill="#1b2b33">Einplanen</text>
<text x="110" y="1714" font-size="15" fill="#f5a61a" font-family="DejaVu Sans Mono, Consolas, monospace">./05_install_cron.sh</text>
<text x="126" y="1736" font-size="13.5" fill="#f5a61a" font-family="DejaVu Sans Mono, Consolas, monospace">(ohne)</text>
<text x="204" y="1736" font-size="13.5" fill="#1b2b33">Einträge setzen oder aktualisieren</text>
<text x="126" y="1757" font-size="13.5" fill="#f5a61a" font-family="DejaVu Sans Mono, Consolas, monospace">--show</text>
<text x="204" y="1757" font-size="13.5" fill="#1b2b33">nur anzeigen, nichts ändern</text>
<text x="126" y="1778" font-size="13.5" fill="#f5a61a" font-family="DejaVu Sans Mono, Consolas, monospace">--remove</text>
<text x="204" y="1778" font-size="13.5" fill="#1b2b33">Einträge wieder entfernen</text>
<text x="110" y="1809" font-size="13" fill="#5d6b73">Setzt zwei Zeilen: Export und Auslagerung. Kontrolle:  crontab -l</text>
<rect x="40" y="1867" width="1100" height="879" rx="14" fill="#ffffff" stroke="#d5dde1"/>
<path d="M 40 1881 a 14 14 0 0 1 14 -14 h 1072 a 14 14 0 0 1 14 14 v 52 h -1100 z" fill="#006887"/>
<circle cx="74" cy="1900.0" r="17" fill="#ffffff" opacity="0.9"/>
<text x="74" y="1907.0" font-size="19" font-weight="700" fill="#006887" text-anchor="middle">3</text>
<text x="106" y="1897" font-size="20" font-weight="700" fill="#ffffff">Betrieb</text>
<text x="106" y="1917" font-size="13.5" fill="#ffffff" opacity="0.85">Läuft von selbst</text>
<rect x="54" y="1945" width="1072" height="96" rx="9" fill="#f2f5f7"/>
<rect x="54" y="1945" width="4" height="96" fill="#006887"/>
<circle cx="86" cy="1971" r="13" fill="#006887"/>
<text x="86" y="1976" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">13</text>
<text x="110" y="1969" font-size="16.5" font-weight="600" fill="#1b2b33">Täglich</text>
<text x="110" y="1995" font-size="15" fill="#006887" font-family="DejaVu Sans Mono, Consolas, monospace">Export  →  Archivierung  →  Auslagerung  →  Aufräumen</text>
<text x="110" y="2019" font-size="13" fill="#5d6b73">Alles eines Tages in einem Tagesordner. Nach Ablauf der Frist fällt er als Ganzes weg.</text>
<rect x="54" y="2051" width="1072" height="96" rx="9" fill="#f2f5f7"/>
<rect x="54" y="2051" width="4" height="96" fill="#006887"/>
<circle cx="86" cy="2077" r="13" fill="#006887"/>
<text x="86" y="2082" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">14</text>
<text x="110" y="2075" font-size="16.5" font-weight="600" fill="#1b2b33">Log ansehen</text>
<text x="110" y="2101" font-size="15" fill="#006887" font-family="DejaVu Sans Mono, Consolas, monospace">tail -50 &quot;$(ls -1t &lt;EXPORTPFAD&gt;/logs/schema_export_*.log | head -1)&quot;</text>
<text x="110" y="2125" font-size="13" fill="#5d6b73">Jede Zeile mit Zeitstempel. Alte Logs verschwinden mit derselben Frist.</text>
<rect x="54" y="2157" width="1072" height="96" rx="9" fill="#f2f5f7"/>
<rect x="54" y="2157" width="4" height="96" fill="#006887"/>
<circle cx="86" cy="2183" r="13" fill="#006887"/>
<text x="86" y="2188" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">15</text>
<text x="110" y="2181" font-size="16.5" font-weight="600" fill="#1b2b33">Einstellungen ändern</text>
<text x="110" y="2207" font-size="15" fill="#006887" font-family="DejaVu Sans Mono, Consolas, monospace">vi &lt;SKRIPTPFAD&gt;/export.conf</text>
<text x="110" y="2231" font-size="13" fill="#5d6b73">Aufbewahrung, Threads, Mindestplatz, Mail, StorageBox. Ein ungültiger Wert hält den Lauf an.</text>
<rect x="54" y="2263" width="1072" height="96" rx="9" fill="#f2f5f7"/>
<rect x="54" y="2263" width="4" height="96" fill="#006887"/>
<circle cx="86" cy="2289" r="13" fill="#006887"/>
<text x="86" y="2294" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">16</text>
<text x="110" y="2287" font-size="16.5" font-weight="600" fill="#1b2b33">Schemas ändern</text>
<text x="110" y="2313" font-size="15" fill="#006887" font-family="DejaVu Sans Mono, Consolas, monospace">vi &lt;SKRIPTPFAD&gt;/export_schemas.txt</text>
<text x="110" y="2337" font-size="13" fill="#5d6b73">Ein Schema pro Zeile, # kommentiert aus. Beides gilt ab dem nächsten Lauf: danach ./03_preflight.sh, Skripte und Crontab bleiben unverändert.</text>
<rect x="54" y="2369" width="1072" height="188" rx="9" fill="#f2f5f7"/>
<rect x="54" y="2369" width="4" height="188" fill="#006887"/>
<circle cx="86" cy="2395" r="13" fill="#006887"/>
<text x="86" y="2400" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">17</text>
<text x="110" y="2393" font-size="16.5" font-weight="600" fill="#1b2b33">Auslagern von Hand  ·  falls Auslagerung</text>
<text x="110" y="2419" font-size="15" fill="#006887" font-family="DejaVu Sans Mono, Consolas, monospace">./06_offload_storagebox.sh</text>
<text x="126" y="2441" font-size="13.5" fill="#006887" font-family="DejaVu Sans Mono, Consolas, monospace">(ohne)</text>
<text x="221" y="2441" font-size="13.5" fill="#1b2b33">den heutigen Tagesordner übertragen</text>
<text x="126" y="2462" font-size="13.5" fill="#006887" font-family="DejaVu Sans Mono, Consolas, monospace">JJJJ-MM-TT</text>
<text x="221" y="2462" font-size="13.5" fill="#1b2b33">genau diesen Tag noch einmal übertragen</text>
<text x="126" y="2483" font-size="13.5" fill="#006887" font-family="DejaVu Sans Mono, Consolas, monospace">--pending</text>
<text x="221" y="2483" font-size="13.5" fill="#1b2b33">alles nachholen, was noch keinen Vermerk hat</text>
<text x="126" y="2504" font-size="13.5" fill="#006887" font-family="DejaVu Sans Mono, Consolas, monospace">--check</text>
<text x="221" y="2504" font-size="13.5" fill="#1b2b33">nur die Verbindung prüfen</text>
<text x="110" y="2535" font-size="13" fill="#5d6b73">Der Cronjob macht das ohnehin täglich. --pending hilft nach einer Nacht ohne Netz.</text>
<rect x="54" y="2567" width="1072" height="167" rx="9" fill="#f2f5f7"/>
<rect x="54" y="2567" width="4" height="167" fill="#006887"/>
<circle cx="86" cy="2593" r="13" fill="#006887"/>
<text x="86" y="2598" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">18</text>
<text x="110" y="2591" font-size="16.5" font-weight="600" fill="#1b2b33">Wiederherstellen</text>
<text x="110" y="2617" font-size="15" fill="#006887" font-family="DejaVu Sans Mono, Consolas, monospace">./90_restore_schema.sh</text>
<text x="126" y="2639" font-size="13.5" fill="#006887" font-family="DejaVu Sans Mono, Consolas, monospace">--list</text>
<text x="277" y="2639" font-size="13.5" fill="#1b2b33">vorhandene Archive auflisten  (auch ohne Angabe)</text>
<text x="126" y="2660" font-size="13.5" fill="#006887" font-family="DejaVu Sans Mono, Consolas, monospace">SCHEMA JJJJ-MM-TT</text>
<text x="277" y="2660" font-size="13.5" fill="#1b2b33">Archiv entpacken, die Datenbank bleibt unberührt</text>
<text x="126" y="2681" font-size="13.5" fill="#006887" font-family="DejaVu Sans Mono, Consolas, monospace">--import</text>
<text x="277" y="2681" font-size="13.5" fill="#1b2b33">zusätzlich zurückspielen — überschreibt, fragt vorher nach</text>
<text x="110" y="2712" font-size="13" fill="#5d6b73">Der IMPORT verlangt den Schemanamen als Bestätigung.</text>
</svg>